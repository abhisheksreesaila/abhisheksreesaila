<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Abhishek Sreesaila. Best-in-class personal AI agents, running locally on hardware you already own.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#14112a"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a18"/><stop offset=".5" stop-color="#ff3d77"/><stop offset="1" stop-color="#ffc83d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".85" cy=".2" r=".6">
      <stop offset="0" stop-color="#ff5a36" stop-opacity=".35"/><stop offset="1" stop-color="#ff5a36" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="20" fill="url(#glow)"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="92" fill="#ffb27a" font-size="18" font-weight="600" letter-spacing="4">THE MISSION</text>
    <text x="64" y="150" fill="#ffffff" font-size="44" font-weight="700">Best-in-class personal AI agents,</text>
    <text x="64" y="204" fill="url(#flame)" font-size="44" font-weight="700">running on hardware you already own.</text>
    <rect x="64" y="232" width="120" height="4" rx="2" fill="url(#flame)"/>
    <text x="64" y="268" fill="#aab3c5" font-size="18">Abhishek Sreesaila  ·  local first  ·  agent-native  ·  your data stays yours</text>
  </g>
</svg>
